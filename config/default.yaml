# All the numbers and paths a run needs, in one place; nothing below should be
# hardcoded in src/. Override any key from the CLI, example:
# python -m skynet train --override scene_repr=bev

seed: 42

# scene representation and model params:
scene_repr: latent_bev
diffusion:
  steps: 50 # placeholder, tune in Task 15

paths:
  data_root: data/nuscenes
  checkpoints: models/
  results: results/

data:
  version: v1.0-mini      # use v1.0-trainval for real ones
  past_frames: 3          # P
  future_frames: 6        # N

eval:
  horizons_s: [1, 2, 3]
  ood_shift_m: 0.5

logging:
  level: INFO
